steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/meetiq:latest', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/meetiq:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - meetiq
      - '--image=gcr.io/$PROJECT_ID/meetiq:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=300'
      - '--set-env-vars=GCP_PROJECT=$PROJECT_ID,DB_NAME=meetingdb,DB_USER=postgres,MANAGER_NAME=hariharan-projectmanager,GCP_LOCATION=us-central1'
      - '--set-secrets=DB_PASSWORD=DB_PASSWORD:latest,MANAGER_EMAIL=MANAGER_EMAIL:latest,GCS_BUCKET=GCS_BUCKET:latest,CLOUD_SQL_INSTANCE=CLOUD_SQL_INSTANCE:latest,SHEET_LOG_RAG=SHEET_LOG_RAG:latest,SHEET_TRACKER_RAG=SHEET_TRACKER_RAG:latest,SHEET_LOG_PLIPKARY=SHEET_LOG_PLIPKARY:latest,SHEET_TRACKER_PLIPKARY=SHEET_TRACKER_PLIPKARY:latest'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:meeting-intelligence-db'
      - '--service-account=meetiq-sa@$PROJECT_ID.iam.gserviceaccount.com'

images:
  - 'gcr.io/$PROJECT_ID/meetiq:latest'